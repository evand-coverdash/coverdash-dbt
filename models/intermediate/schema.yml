version: 2

models:
  - name: int_business
    description: >
      One row per business: dimensions, funnel milestone timestamps, 0/1 cohort flags, and the
      premium / revenue measures from the warm-transfer tracker. Aggregate it by any dimension;
      sum(dN_*) flags give the tracker's *BusinessCount columns. All windows are measured in
      calendar days from business_created_date (Eastern). Test businesses are flagged, not removed.
      Policies and quotes on 'Fake Insurance' are excluded from every rollup. Materialized as a table.
    columns:
      # keys / dimensions
      - name: business_id
        description: "Primary key"
        tests: [not_null, unique]
      - name: is_test_business
        description: "Business.isTest OR owner name contains COVERDASH/TEST. Filter this out in marts."
      - name: business_created_date
        description: "Cohort date (Eastern)"
      - name: business_age_days
        description: "Days between business_created_date and today (Eastern) at build time"
      - name: license_name
        description: "Partner license the business came through"
      - name: partner_name
        description: "Partner that owns the license"
      - name: transfer_type
        description: "Warm Transfer / Data Lead / Other Non-Partner / Partner (from stg_license)"
      - name: warm_transfer_campaign
        description: "Business.warmTransferCampaign"
      - name: campaign_type
        description: "'Test' if the campaign name contains 'carrier', else 'Prod'"
      - name: claimed_status
        description: "OTHER if no warm transfer; else the transfer's claimed status (NULL = CLAIMED)"
        tests:
          - accepted_values:
              arguments:
                values: ['OTHER', 'CLAIMED', 'UNCLAIMED']
      - name: warm_transfer_bid_price
        description: "Bid price paid for this business's warm transfer (0 if none)"
      - name: credited_account_executive
        description: "coalesce(soldBy, accountExecutive)"
      - name: credited_ae_team
        description: "Growth / Core / Enterprise for the credited AE"
      - name: lead_account_executive
        description: "AE on the Lead record (used by ae_performance_monthly)"
      - name: workflow_type
        description: "Lead workflow HIGH_TOUCH / LOW_TOUCH, or NONE"

      # maturity
      - name: is_mature_d7
        description: "1 if the cohort is at least 7 days old (also _d14, _d30, _d60, _d90)"

      # milestone timestamps (Eastern)
      - name: first_attempted_to_contact_at
        description: "First Close status change to 'Attempted to Contact' (ChangeLog, from 2025-09-22)"
      - name: first_made_contact_at
        description: "First Close status change to 'Made Contact'"
      - name: first_junk_at
        description: "First Close status change to 'Junk'"
      - name: first_application_submitted_at
        description: "First application with status COMPLETED / SENT_TO_QUOTING_ENGINE / NO_QUOTES_RETURNED"
      - name: first_quote_presented_at
        description: "First opportunity status change to QUOTE_PRESENTED"
      - name: first_quote_created_at
        description: "First quote, converted from UTC to Eastern"
      - name: first_policy_created_at
        description: "First policy of any sale type or status"
      - name: first_nb_policy_created_at
        description: "First NEW_BUSINESS policy"
      - name: first_nb_cancellation_booked_at
        description: "First CANCELLATION transaction booked on a NEW_BUSINESS policy"

      # cohort flags (0/1)
      - name: d7_attempted_to_contact
        description: "1 if first 'Attempted to Contact' within 7 days"
      - name: d7_made_contact
        description: "1 if first 'Made Contact' within 7 days"
      - name: d7_junk
        description: "1 if first 'Junk' within 7 days"
      - name: quoted
        description: "1 if the business ever received a quote"
      - name: d7_quoted
        description: "1 if first quote within 7 days (also d30_quoted)"
      - name: days_to_d30_quote
        description: "days_to_first_quote when <= 30, else NULL. sum() = tracker's totalTimeToD30Quote"
      - name: d7_quote_presented
        description: "1 if first QUOTE_PRESENTED within 7 days"
      - name: converted
        description: "1 if the business ever had a policy"
      - name: d7_converted
        description: "1 if first policy within 7 days (also d1, d14, d30, d60, d90)"
      - name: d7_chubb_quoted
        description: "1 if first Chubb quote within 7 days"
      - name: d7_chubb_converted
        description: "1 if first NEW_BUSINESS Chubb policy within 7 days (also d30)"
      - name: d7_gaig_quoted
        description: "1 if first GAIG quote within 7 days"
      - name: d7_gaig_converted
        description: "1 if first NEW_BUSINESS GAIG policy within 7 days (also d30)"

      # volume and premium
      - name: quote_count
        description: "Quotes for the business"
      - name: chubb_quoted_premium
        description: "All Chubb quoted premium. sum() where d7_chubb_quoted = 1 gives the tracker's d7ChubbQuotedPremiumAmount"
      - name: gaig_quoted_premium
        description: "All GAIG quoted premium (same pairing with d7_gaig_quoted)"
      - name: policy_count
        description: "Policies of any sale type or status"
      - name: nb_premium
        description: "Premium on NEW_BUSINESS policies"
      - name: d30_nb_premium
        description: "Premium on NEW_BUSINESS policies created within 30 days (also Chubb / GAIG variants)"

      # revenue
      - name: d7_nb_gross_revenue
        description: >
          Signed PolicyTransaction amount on NEW_BUSINESS policies, booked within 7 days of business
          creation. Every type except CANCELLATION; *_PARTIAL excluded. Also d14, d30, and lifetime
          (nb_gross_revenue), plus d30 Chubb / GAIG.
      - name: d30_nb_core_revenue
        description: "Commission + tech fee + agency fee on NB policies booked within 30 days (also lifetime nb_core_revenue)"
      - name: nb_cancellation_amount
        description: "Signed CANCELLATION amounts on NB policies (clawbacks are negative)"
      - name: total_core_revenue
        description: "Commission + tech fee + agency fee across all sale types"

  - name: int_policy_revenue
    description: >
      BOUND policies enriched with revenue fields and time dimensions.
      Used as the base layer for all revenue and commission mart models.
    columns:
      - name: policy_id
        description: "Primary key"
        tests:
          - not_null
          - unique
      - name: business_id
        description: "FK to stg_business"
      - name: carrier_id
        description: "FK to the carrier that issued this policy"
      - name: quote_id
        description: "FK to stg_quote — the accepted quote that became this policy"
      - name: close_opportunity_id
        description: "FK to Close CRM opportunity linked to this policy"
      - name: renewed_from_policy_id
        description: "FK to the prior policy this one renews; null for new business"
      - name: policy_type
        description: "Line of business (GL, BOP, WC, Cyber, PL, etc.)"
      - name: license_name
        description: "The business's partner license (not Policy.licenseName, which is mostly empty); '(no license)' if the business has none"
      - name: policy_license_name
        description: "Policy.licenseName as entered on the policy (often NULL)"
      - name: billing_type
        description: "How the premium is billed (Annual, Monthly, etc.)"
      - name: sale_type
        description: "NEW_BUSINESS, RENEWAL, BOR, CANCEL_REWRITE, etc."
      - name: sales_channel
        description: "Distribution channel through which the policy was sold"
      - name: underwriting_carrier
        description: "Name of the underwriting carrier"
      - name: account_executive
        description: "AE credited with this sale"
      - name: assigned_agent
        description: "Agent assigned to manage this policy"
      - name: is_renewal
        description: "True if this policy renews a prior policy"
      - name: renewal_count
        description: "How many times this policy has been renewed"
      - name: bor_renewal
        description: "True if this is a broker-of-record renewal"
      - name: is_auto_bind
        description: "True if the policy was issued via automated binding"
      - name: is_paygo
        description: "True if this policy uses pay-as-you-go billing"
      - name: premium
        description: "Total policy premium in dollars (numeric)"
      - name: commissionable_premium
        description: "Portion of premium eligible for commission"
      - name: commission_rate
        description: "Commission rate as a decimal (0.12 = 12%)"
      - name: estimated_commission
        description: "Calculated as commissionable_premium × commission_rate"
      - name: mmr_fee
        description: "Monthly minimum revenue fee, if applicable"
      - name: effective_date
        description: "Date coverage begins"
      - name: expiry_date
        description: "Date coverage ends"
      - name: bound_at
        description: "Timestamp when the policy was bound (created_at from source)"
      - name: bound_date
        description: "Calendar date the policy was bound"
      - name: bound_week
        description: "ISO week start date (Monday) of the bound date"
      - name: bound_month
        description: "First day of the month the policy was bound"
      - name: bound_quarter
        description: "First day of the quarter the policy was bound"
      - name: bound_year
        description: "Year the policy was bound"
      - name: effective_month
        description: "First day of the month coverage begins"

  - name: int_warm_transfer
    description: >
      One row per warm-transfer ping, with partner and campaign resolved and the created
      business's outcome joined from int_business.
    columns:
      - name: warm_transfer_id
        tests: [not_null, unique]
      - name: partner_name
        description: "coalesce(campaign partner, business license partner, payload vendor, 'Unknown')"
        tests: [not_null]
      - name: partner_resolved_from
        description: "campaign / business / payload / unknown"
        tests:
          - accepted_values:
              arguments:
                values: ['campaign', 'business', 'payload', 'unknown']
      - name: claimed_status
        description: "Set only on accepted pings (NULL coalesced to CLAIMED)"
      - name: accepted_bid_price
        description: "bid_price when the ping was accepted, else NULL"
