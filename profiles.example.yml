# Copy to profiles.yml (gitignored) or to ~/.dbt/profiles.yml.
# Connection details come from environment variables so no credentials live in files:
#   DBT_HOST, DBT_PORT, DBT_DBNAME, DBT_USER, DBT_PASSWORD
#
# Both targets connect to the ANALYTICS database (never the prod app database).
# Raw app tables are read through the foreign-table schema set by the source_schema var
# (default: replica), which points at the prod read replica via postgres_fdw.

coverdash_analytics:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DBT_HOST') }}"
      port: "{{ env_var('DBT_PORT', '5432') | int }}"
      dbname: "{{ env_var('DBT_DBNAME') }}"
      user: "{{ env_var('DBT_USER') }}"
      password: "{{ env_var('DBT_PASSWORD') }}"
      schema: dbt_analytics_dev        # dev models land in dbt_analytics_dev_<layer>
      threads: 4
      connect_timeout: 10
      sslmode: require

    prod:
      type: postgres
      host: "{{ env_var('DBT_HOST') }}"
      port: "{{ env_var('DBT_PORT', '5432') | int }}"
      dbname: "{{ env_var('DBT_DBNAME') }}"
      user: "{{ env_var('DBT_USER') }}"
      password: "{{ env_var('DBT_PASSWORD') }}"
      schema: analytics                # prod models land in staging / intermediate / marts
      threads: 4
      connect_timeout: 10
      sslmode: require
