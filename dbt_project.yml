name: 'coverdash_analytics'
version: '1.0.0'
config-version: 2
require-dbt-version: ">=1.10.0"   # generic-test arguments use the nested 'arguments:' syntax

profile: 'coverdash_analytics'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Every model lands in the profile's target schema (prod: analytics). The dbt login can create
# tables in that one schema but can't create schemas, so there are no per-layer schemas; the
# stg_ / int_ name prefixes mark the layers. Everything is a table: views would depend on the
# app tables in public and could block the app's schema migrations.
models:
  coverdash_analytics:
    staging:
      +materialized: table
    intermediate:
      +materialized: table
    marts:
      +materialized: table

vars:
  # Schema holding the raw app tables. dbt runs in the prod database and reads them directly
  # (read-only). Override per run with --vars '{source_schema: ...}' if needed.
  source_schema: public
