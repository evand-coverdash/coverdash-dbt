name: 'coverdash_analytics'
version: '1.0.0'
config-version: 2
require-dbt-version: ">=1.10.0"   # generic-test arguments use the nested 'arguments:' syntax

profile: 'coverdash_analytics'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  coverdash_analytics:
    staging:
      +materialized: table
      +schema: staging
    intermediate:
      +materialized: table
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

vars:
  # Schema in the analytics database that holds the postgres_fdw foreign tables pointing at the
  # prod read replica. Override per run with --vars '{source_schema: ...}' if needed.
  source_schema: replica
